name: Deploy LoadIx Demo

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: loadix-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/loadix-deploy-key
          chmod 600 ~/.ssh/loadix-deploy-key

          ssh-keyscan \
            -p "${VPS_PORT:-22}" \
            -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

      - name: Deploy LoadIx demo
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh \
            -i ~/.ssh/loadix-deploy-key \
            -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" << 'EOF'
              set -Eeuo pipefail

              cd /root/LoadIx

              echo "Fetching latest master branch..."
              git pull
              git fetch origin master
              if [ "$(git config --bool core.sparseCheckout || echo false)" = "true" ]; then
                echo "Disabling sparse checkout so Docker receives the complete source tree..."
                git sparse-checkout disable
              fi
              git checkout master
              git reset --hard origin/master

              echo "Verifying the complete source tree is materialized..."
              tracked_cs_count="$(git ls-files 'src/**/*.cs' | wc -l)"
              present_cs_count="$(find src -type f -name '*.cs' \
                -not -path '*/bin/*' \
                -not -path '*/obj/*' | wc -l)"
              if [ "$present_cs_count" -ne "$tracked_cs_count" ]; then
                echo "Incomplete checkout: found $present_cs_count of $tracked_cs_count tracked C# files."
                exit 1
              fi

              echo "Loading dependency credentials from the existing containers..."
              read_container_environment() {
                container_id="$1"
                variable_name="$2"

                docker inspect \
                  --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  "$container_id" \
                  | sed -n "s/^${variable_name}=//p" \
                  | tail -n 1
              }

              rabbitmq_container="$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                ps -q rabbitmq)"
              minio_container="$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                ps -q minio)"

              if [ -n "$rabbitmq_container" ]; then
                export RABBITMQ_USERNAME="$(read_container_environment \
                  "$rabbitmq_container" RABBITMQ_DEFAULT_USER)"
                export RABBITMQ_PASSWORD="$(read_container_environment \
                  "$rabbitmq_container" RABBITMQ_DEFAULT_PASS)"
              fi

              if [ -n "$minio_container" ]; then
                export MINIO_ACCESS_KEY="$(read_container_environment \
                  "$minio_container" MINIO_ROOT_USER)"
                export MINIO_SECRET_KEY="$(read_container_environment \
                  "$minio_container" MINIO_ROOT_PASSWORD)"
              fi

              : "${RABBITMQ_USERNAME:?RabbitMQ username is not configured and could not be recovered.}"
              : "${RABBITMQ_PASSWORD:?RabbitMQ password is not configured and could not be recovered.}"
              : "${MINIO_ACCESS_KEY:?MinIO access key is not configured and could not be recovered.}"
              : "${MINIO_SECRET_KEY:?MinIO secret key is not configured and could not be recovered.}"

              echo "Validating Docker Compose configuration..."
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                config --quiet

              echo "Running pending database migrations..."
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                --profile tools \
                run --rm migrate

              echo "Refreshing deterministic demo roles and data..."
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                --profile tools \
                run --rm seed-demo

              echo "Building updated application images..."
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                build --pull --no-cache api web

              expected_api_image="$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                images -q api)"
              expected_web_image="$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                images -q web)"

              echo "Force-redeploying the freshly rebuilt API and frontend..."
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                up -d --force-recreate --remove-orphans api web caddy

              running_api_image="$(docker inspect --format '{{.Image}}' "$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                ps -q api)")"
              running_web_image="$(docker inspect --format '{{.Image}}' "$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                ps -q web)")"
              test "$running_api_image" = "$expected_api_image"
              test "$running_web_image" = "$expected_web_image"

              echo "Waiting for containers..."
              sleep 10

              echo "Container status:"
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                ps

              echo "Checking API health from inside the container..."
              for attempt in $(seq 1 30); do
                if docker compose \
                  -f compose.yaml \
                  -f compose.demo.yaml \
                  exec -T api \
                  curl --fail --silent \
                  http://localhost:8080/health/ready \
                  > /dev/null; then

                  echo "LoadIx API is healthy."
                  break
                fi

                if [ "$attempt" -eq 30 ]; then
                  echo "API failed its health check."

                  docker compose \
                    -f compose.yaml \
                    -f compose.demo.yaml \
                    logs --tail=200 api

                  exit 1
                fi

                echo "Health check attempt $attempt of 30..."
                sleep 5
              done

              echo "Checking that the deployed edge-device route is registered..."
              edge_status="$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                exec -T api \
                curl --output /dev/null --silent --write-out '%{http_code}' \
                'http://localhost:8080/api/v1/edge-devices/?page=1&pageSize=1')"
              if [ "$edge_status" != "401" ]; then
                echo "Expected unauthenticated edge-device route to return 401; received $edge_status."
                docker compose \
                  -f compose.yaml \
                  -f compose.demo.yaml \
                  logs --tail=200 api
                exit 1
              fi

              echo "Checking Caddy..."
              docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                exec -T caddy \
                caddy validate \
                --config /etc/caddy/Caddyfile

              echo "Checking the public HTTPS path..."
              demo_domain="$(docker compose \
                -f compose.yaml \
                -f compose.demo.yaml \
                exec -T caddy \
                printenv DEMO_DOMAIN)"
              for attempt in $(seq 1 30); do
                public_status="$(curl \
                  --output /dev/null \
                  --silent \
                  --show-error \
                  --write-out '%{http_code}' \
                  --connect-timeout 5 \
                  --max-time 15 \
                  "https://${demo_domain}/api/v1/system/info" || true)"

                if [ "$public_status" = "200" ]; then
                  echo "Public HTTPS endpoint is healthy."
                  break
                fi

                if [ "$attempt" -eq 30 ]; then
                  echo "Public HTTPS endpoint failed with status '${public_status:-connection failure}'."
                  docker compose \
                    -f compose.yaml \
                    -f compose.demo.yaml \
                    ps
                  docker compose \
                    -f compose.yaml \
                    -f compose.demo.yaml \
                    logs --tail=200 caddy web api
                  exit 1
                fi

                echo "Public endpoint check attempt $attempt of 30 returned '${public_status:-connection failure}'..."
                sleep 5
              done

              docker image prune -f

              echo "LoadIx demo deployment completed successfully."
          EOF
