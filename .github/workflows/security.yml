name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Scan .NET dependencies
        run: dotnet list LoadIx.slnx package --vulnerable --include-transitive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: npm
          cache-dependency-path: apps/loadix-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/loadix-web
        run: npm ci

      - name: Scan frontend dependencies
        working-directory: apps/loadix-web
        run: npm audit --audit-level=high

  container-scan:
    name: Container vulnerability scan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
          - name: worker
            dockerfile: deploy/worker.Dockerfile
          - name: migrations
            dockerfile: deploy/migrations.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.name }} image
        run: >-
          docker build
          --file ${{ matrix.dockerfile }}
          --tag loadix-${{ matrix.name }}:security
          ${{ matrix.name == 'web' && '--build-arg API_UPSTREAM=loadix-api:8080 --build-arg API_HOST=loadix-api' || '' }}
          .

      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: loadix-${{ matrix.name }}:security
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
          version: v0.72.0
