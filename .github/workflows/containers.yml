name: Containers

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build production containers
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
          - name: web
            dockerfile: deploy/web.Dockerfile
          - name: worker
            dockerfile: deploy/worker.Dockerfile
          - name: migrations
            dockerfile: deploy/migrations.Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Build ${{ matrix.name }} image
        run: >-
          docker build
          --file ${{ matrix.dockerfile }}
          --tag loadix-${{ matrix.name }}:${{ github.sha }}
          ${{ matrix.name == 'web' && '--build-arg API_UPSTREAM=api:8080 --build-arg API_HOST=api' || '' }}
          .

  publish:
    name: Publish immutable images to GitHub Container Registry
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    environment: container-registry
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive lowercase image repository
        shell: bash
        run: |
          set -euo pipefail
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPOSITORY=ghcr.io/$repository" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/loadix-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=loadix-api
          cache-to: type=gha,mode=max,scope=loadix-api

      - name: Publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          build-args: |
            API_UPSTREAM=api:8080
            API_HOST=api
            VITE_API_BASE_URL=/api
          tags: ${{ env.IMAGE_REPOSITORY }}/loadix-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=loadix-web
          cache-to: type=gha,mode=max,scope=loadix-web

      - name: Publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/loadix-worker:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=loadix-worker
          cache-to: type=gha,mode=max,scope=loadix-worker

      - name: Publish migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/migrations.Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}/loadix-migrations:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=loadix-migrations
          cache-to: type=gha,mode=max,scope=loadix-migrations
