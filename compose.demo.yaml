name: loadix-demo

# Public demo overlay. The base compose file remains the local-development
# setup; this file keeps databases and dependency consoles off the public NIC
# and terminates HTTPS at Caddy.
services:
  api:
    environment:
      # The public overlay must run with production safeguards enabled. Supply
      # deployment secrets explicitly; an empty signing key or scanner keeps
      # the API from starting rather than silently using local defaults.
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${DEMO_DOMAIN:-crimsonskyit.co.za}
      LoadIx__WebOrigin: https://${DEMO_DOMAIN:-crimsonskyit.co.za}
      LoadIx__TrustedProxyIp: ${TRUSTED_PROXY_IP:-}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:-}
      ConnectionStrings__Database: >-
        Server=sqlserver,1433;Database=${SQL_DATABASE:-LoadIx};
        User Id=${SQL_USER:-sa};Password=${SQL_PASSWORD:-};
        Encrypt=False;TrustServerCertificate=True
      Dependencies__RabbitMqUsername: ${RABBITMQ_USERNAME:-${RABBITMQ_USER:-}}
      Dependencies__RabbitMqPassword: ${RABBITMQ_PASSWORD:-}
      Documents__MalwareScanner: ${MALWARE_SCANNER:-Unconfigured}
      Documents__AccessKey: ${MINIO_ACCESS_KEY:-${MINIO_USER:-}}
      Documents__SecretKey: ${MINIO_SECRET_KEY:-${MINIO_PASSWORD:-}}
      AccountEmail__Host: ${SMTP_HOST:-mail.crimsonskyit.co.za}
      AccountEmail__Port: ${SMTP_PORT:-587}
      AccountEmail__FromAddress: ${SMTP_FROM_ADDRESS:-accounts@crimsonskyit.co.za}
      AccountEmail__Username: ${SMTP_USERNAME:-accounts@crimsonskyit.co.za}
      AccountEmail__Password: ${SMTP_PASSWORD:-}
      AccountEmail__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    ports: !reset []

  web:
    ports: !reset []

  sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-}
    ports: !override
      - "127.0.0.1:${SQL_PORT:-1433}:1433"

  redis:
    ports: !reset []

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-${RABBITMQ_USER:-}}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    ports: !override
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-${MINIO_USER:-}}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-${MINIO_PASSWORD:-}}
    ports: !override
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-crimsonskyit.co.za}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    image: mcr.microsoft.com/dotnet/sdk:10.0.103
    working_dir: /workspace

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__Database: >-
        Server=sqlserver,1433;Database=${SQL_DATABASE:-LoadIx};
        User Id=sa;Password=${SQL_PASSWORD:-LoadIx_Local_Only_123!};
        Encrypt=False;TrustServerCertificate=True

    volumes:
      - ./:/workspace

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - backend

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        echo "Restoring project dependencies..."
        dotnet restore src/LoadIx.Api/LoadIx.Api.csproj

        echo "Restoring EF Core tools..."
        dotnet tool restore

        echo "Building LoadIx..."
        dotnet build src/LoadIx.Api/LoadIx.Api.csproj \
          --configuration Release \
          --no-restore

        echo "Applying pending database migrations..."
        dotnet ef database update \
          --project src/LoadIx.Infrastructure \
          --startup-project src/LoadIx.Api \
          --configuration Release \
          --no-build

        echo "Database migrations completed."
  seed-demo:
    profiles: ["tools"]
    image: mcr.microsoft.com/dotnet/sdk:10.0.103
    working_dir: /workspace

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__Database: >-
        Server=sqlserver,1433;Database=${SQL_DATABASE:-LoadIx};
        User Id=sa;Password=${SQL_PASSWORD:-LoadIx_Local_Only_123!};
        Encrypt=False;TrustServerCertificate=True

    volumes:
      - ./:/workspace

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - backend

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        dotnet restore src/LoadIx.Api/LoadIx.Api.csproj

        dotnet run \
          --project src/LoadIx.Api \
          --no-launch-profile \
          -- \
          --environment Development \
          --seed-development

volumes:
  caddy-data:
  caddy-config:
