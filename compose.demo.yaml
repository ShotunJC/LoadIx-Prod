name: loadix-demo

# Public demo overlay. The base compose file remains the local-development
# setup; this file keeps databases and dependency consoles off the public NIC
# and terminates HTTPS at Caddy.
services:
  api:
    environment:
      # This legacy overlay is a synthetic demonstration only. It intentionally
      # retains Development behavior and must never carry pilot/customer data.
      ASPNETCORE_ENVIRONMENT: Development
      AllowedHosts: ${DEMO_DOMAIN:-crimsonskyit.co.za}
      LoadIx__WebOrigin: https://${DEMO_DOMAIN:-crimsonskyit.co.za}
      LoadIx__RunBackgroundWorkers: "true"
      LoadIx__TrustedProxyIp: ${TRUSTED_PROXY_IP:-}
      DataProtection__Provider: FileSystem
      DataProtection__KeyRingPath: /home/app/.aspnet/DataProtection-Keys
      Authentication__SigningKey: ${JWT_SIGNING_KEY:-}
      ConnectionStrings__Database: >-
        Server=sqlserver,1433;Database=${SQL_DATABASE:-LoadIx};
        User Id=${SQL_USER:-sa};Password=${SQL_PASSWORD:-};
        Encrypt=False;TrustServerCertificate=True
      Dependencies__RabbitMqUsername: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      Dependencies__RabbitMqPassword: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      Dependencies__RabbitMqUseSsl: ${RABBITMQ_USE_SSL:-false}
      Dependencies__RabbitMqServerName: ${RABBITMQ_SERVER_NAME:-rabbitmq}
      Dependencies__ObjectStorageHost: minio
      Dependencies__ObjectStoragePort: 9000
      Dependencies__SmtpHost: ${SMTP_HOST:-mail.crimsonskyit.co.za}
      Dependencies__SmtpPort: ${SMTP_PORT:-587}
      Documents__MalwareScanner: ${MALWARE_SCANNER:-Unconfigured}
      Documents__Provider: S3Compatible
      Documents__AccessKey: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      Documents__SecretKey: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      AccountEmail__Host: ${SMTP_HOST:-mail.crimsonskyit.co.za}
      AccountEmail__Port: ${SMTP_PORT:-587}
      AccountEmail__FromAddress: ${SMTP_FROM_ADDRESS:-accounts@crimsonskyit.co.za}
      AccountEmail__Username: ${SMTP_USERNAME:-accounts@crimsonskyit.co.za}
      AccountEmail__Password: ${SMTP_PASSWORD:-}
      AccountEmail__EnableSsl: ${SMTP_ENABLE_SSL:-true}
    ports: !reset []
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --header "Host: $${AllowedHosts}" http://localhost:8080/health/ready',
        ]

  web:
    ports: !reset []

  sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:-}
    ports: !override
      - "127.0.0.1:${SQL_PORT:-1433}:1433"

  redis:
    ports: !reset []

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports: !override
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports: !override
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    ports: !override
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-crimsonskyit.co.za}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.demo:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    image: mcr.microsoft.com/dotnet/sdk:10.0.103
    working_dir: /workspace

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__Database: >-
        Server=sqlserver,1433;Database=${SQL_DATABASE:-LoadIx};
        User Id=sa;Password=${SQL_PASSWORD:-LoadIx_Local_Only_123!};
        Encrypt=False;TrustServerCertificate=True

    volumes:
      - ./:/workspace

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - backend

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        cleanup_build_outputs() {
          find /workspace/src \
            -type d \( -name bin -o -name obj \) \
            -prune -exec rm -rf -- {} +
        }

        generate_compile_manifest() {
          for project in LoadIx.Api LoadIx.Infrastructure; do
            manifest="/tmp/$$project.CompileItems.props"
            {
              printf '<Project><ItemGroup>\n'
              find "/workspace/src/$$project" -type f -name '*.cs' \
                -not -path '*/bin/*' -not -path '*/obj/*' \
                | sort \
                | while IFS= read -r source; do
                    printf '  <Compile Include="%s" />\n' "$$source"
                  done
              printf '</ItemGroup></Project>\n'
            } > "$$manifest"
          done
          export LoadIxApiCompileManifest=/tmp/LoadIx.Api.CompileItems.props
          export LoadIxInfrastructureCompileManifest=/tmp/LoadIx.Infrastructure.CompileItems.props
        }

        trap cleanup_build_outputs EXIT
        cleanup_build_outputs
        for project in \
          LoadIx.Api \
          LoadIx.Application \
          LoadIx.Contracts \
          LoadIx.Domain \
          LoadIx.Infrastructure; do
          mkdir -p \
            "src/$$project/bin/Debug/net10.0" \
            "src/$$project/bin/Release/net10.0" \
            "src/$$project/obj/Debug/net10.0" \
            "src/$$project/obj/Release/net10.0"
        done
        generate_compile_manifest

        echo "Restoring project dependencies..."
        dotnet restore src/LoadIx.Api/LoadIx.Api.csproj

        echo "Restoring EF Core tools..."
        dotnet tool restore

        echo "Building LoadIx..."
        dotnet build src/LoadIx.Api/LoadIx.Api.csproj \
          --configuration Release \
          --no-restore

        echo "Applying pending database migrations..."
        dotnet ef database update \
          --project src/LoadIx.Infrastructure \
          --startup-project src/LoadIx.Api \
          --configuration Release \
          --no-build

        echo "Database migrations completed."
  seed-demo:
    profiles: ["tools"]
    image: mcr.microsoft.com/dotnet/sdk:10.0.103
    working_dir: /workspace

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__Database: >-
        Server=sqlserver,1433;Database=${SQL_DATABASE:-LoadIx};
        User Id=sa;Password=${SQL_PASSWORD:-LoadIx_Local_Only_123!};
        Encrypt=False;TrustServerCertificate=True

    volumes:
      - ./:/workspace

    depends_on:
      sqlserver:
        condition: service_healthy

    networks:
      - backend

    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -e

        cleanup_build_outputs() {
          find /workspace/src \
            -type d \( -name bin -o -name obj \) \
            -prune -exec rm -rf -- {} +
        }

        generate_compile_manifest() {
          for project in LoadIx.Api LoadIx.Infrastructure; do
            manifest="/tmp/$$project.CompileItems.props"
            {
              printf '<Project><ItemGroup>\n'
              find "/workspace/src/$$project" -type f -name '*.cs' \
                -not -path '*/bin/*' -not -path '*/obj/*' \
                | sort \
                | while IFS= read -r source; do
                    printf '  <Compile Include="%s" />\n' "$$source"
                  done
              printf '</ItemGroup></Project>\n'
            } > "$$manifest"
          done
          export LoadIxApiCompileManifest=/tmp/LoadIx.Api.CompileItems.props
          export LoadIxInfrastructureCompileManifest=/tmp/LoadIx.Infrastructure.CompileItems.props
        }

        trap cleanup_build_outputs EXIT
        cleanup_build_outputs
        for project in \
          LoadIx.Api \
          LoadIx.Application \
          LoadIx.Contracts \
          LoadIx.Domain \
          LoadIx.Infrastructure; do
          mkdir -p \
            "src/$$project/bin/Debug/net10.0" \
            "src/$$project/bin/Release/net10.0" \
            "src/$$project/obj/Debug/net10.0" \
            "src/$$project/obj/Release/net10.0"
        done
        generate_compile_manifest

        dotnet restore src/LoadIx.Api/LoadIx.Api.csproj

        dotnet run \
          --project src/LoadIx.Api \
          --no-launch-profile \
          -- \
          --environment Development \
          --seed-development

volumes:
  caddy-data:
  caddy-config:
